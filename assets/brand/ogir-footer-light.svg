<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 92" width="1200" height="92" role="img" aria-label="OGIR Positiva">
  <title>OGIR Positiva</title>
  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2681C" stop-opacity="0"/><stop offset="0.5" stop-color="#F2681C"/>
      <stop offset="1" stop-color="#F2681C" stop-opacity="0"/>
    </linearGradient>

    <style>
      /* Solo bucles ambientales: sin animación de entrada, el gráfico se ve
         completo desde el primer fotograma. */
      .radar { transform-box: view-box; transform-origin: 600px 40px; opacity: 0;
               animation: radar 6s ease-out infinite; }
      @keyframes radar {
        0%   { opacity: 0; transform: scale(.84); }
        25%  { opacity: 1; }
        100% { opacity: 0; transform: scale(1.1); }
      }
      .r1 { animation-delay: 0s; } .r2 { animation-delay: .8s; } .r3 { animation-delay: 1.6s; }

      .halo { transform-box: view-box; transform-origin: 150px 128px;
              animation: spin 34s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      @media (prefers-reduced-motion: reduce) {
        .radar { opacity: .85 !important; animation: none !important; transform: none !important; }
        .halo  { animation: none !important; transform: none !important; }
      }
    </style>
  </defs>

  <rect x="0" y="6" width="1200" height="1.25" fill="url(#rule)"/>

  <g transform="translate(600 54) scale(0.20) translate(-150 -128)">
    <circle class="halo" cx="150" cy="128" r="80" fill="none" stroke="#8C959F" stroke-opacity="0.38" stroke-width="1.4" stroke-dasharray="3 9"/>
    <path d="M208 128 A58 58 0 1 1 183.27 80.49" fill="none" stroke="#8C959F" stroke-width="22"/>
    <rect x="150" y="117" width="70" height="22" rx="1.5" fill="#8C959F"/>
    <path d="M168.73 148.81 A28 28 0 1 1 168.73 107.19" fill="none" stroke="#0C1620" stroke-width="15"/>
  </g>
</svg>
